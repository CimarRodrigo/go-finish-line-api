openapi: 3.0.3
info:
  title: FinishLine API
  description: Backend for footrace participant registration.
  version: 0.9.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
    description: Operational and health endpoints
  - name: auth
    description: Authentication — login, token refresh
  - name: users
    description: Admin user management
  - name: registrations
    description: >-
      Race registration (called by our own frontend BFF, not directly by
      browsers — see the endpoint's X-Service-Secret requirement) and the
      admin report
  - name: races
    description: The registrable race list (we own it; synced from Sanity)
  - name: reports
    description: >-
      The admin dashboard's metrics. One endpoint per question rather than a
      single dashboard payload, so each widget filters and refreshes on its
      own; a caller that wants them together composes them upstream. Every
      one takes an optional race_id — absent means across all races — and
      every one counts confirmed registrations only, so the panels reconcile
      with each other.
  - name: participants
    description: The people who have registered, searchable and paginated
  - name: webhooks
    description: Inbound machine-to-machine events
paths:
  /api/v1/registrations:
    post:
      operationId: register
      summary: Register for a race (machine-to-machine, called by the frontend BFF)
      description: >-
        Not a public browser endpoint — the only caller is our own Astro BFF,
        authenticated by a shared secret in the `X-Service-Secret` header
        (constant-time compared, same pattern as the Sanity webhook's
        `X-Webhook-Secret`). Upserts the person by email (one participant per
        email) and creates their registration for the race. Free races are
        confirmed immediately, assigning a sequential dorsal and sending a
        confirmation email.
      tags:
        - registrations
      parameters:
        - name: X-Service-Secret
          in: header
          required: true
          description: Shared BFF↔Go secret (`SERVICE_SECRET` on this API, `BACKEND_SERVICE_SECRET` on the BFF)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered (and confirmed, for free races)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Malformed body, invalid race id, bad birth_date, or a form validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: birth date cannot be in the future
        "401":
          description: Missing or wrong X-Service-Secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid service secret
        "404":
          description: The referenced race does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: race not found
        "409":
          description: Already registered for this race, or the race is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: already registered for this race
    get:
      operationId: listRegistrations
      summary: Admin report — a race's registrations with dorsals
      tags:
        - registrations
      security:
        - bearerAuth: []
      parameters:
        - name: race_id
          in: query
          required: true
          description: The race to report on, by our internal race_id
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Registrations for the race, ordered by dorsal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationReportRow"
        "400":
          description: Missing or invalid race_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/webhooks/sanity:
    post:
      operationId: sanityWebhook
      summary: Sync a race from Sanity
      description: >-
        Machine-to-machine endpoint called by a Sanity GROQ-powered webhook on
        race document changes. Authenticated by a shared secret in the
        `X-Webhook-Secret` header (not a user token). `create`/`update`
        operations upsert the local race reference; `delete` removes it.
        Unknown/unmapped operations are acknowledged and ignored. This
        replaces the former `/webhooks/strapi` endpoint — Strapi is fully
        decommissioned as a CMS.
      tags:
        - webhooks
      parameters:
        - name: X-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SanityWebhook"
      responses:
        "200":
          description: Event processed (synced, removed, or ignored)
        "400":
          description: Invalid payload or missing slug
        "401":
          description: Missing or wrong webhook secret
  /api/v1/races:
    get:
      operationId: listRaces
      summary: List registrable races (admin)
      description: >-
        Admin-only. The panel lists the races we mirror to obtain the
        `race_id` it needs to pull the registrations report. Each row carries
        our internal `race_id` and the Sanity slug as `document_id`.
        Registration itself uses the `document_id`, so the public form never
        calls this.
      tags:
        - races
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The registrable races, ordered by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Race"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/reports/registrations-timeline:
    get:
      operationId: registrationsTimeline
      summary: Registrations per day (admin)
      description: >-
        One point per day for the last `days` days, ending today, counting
        confirmed registrations. Days with no registrations are included with
        a zero count, so the chart shows the dips instead of drawing a
        straight line across them.
      tags:
        - reports
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          description: >-
            Window size, today included. Defaults to 14 and is capped at 365;
            an absent or unreadable value falls back to the default rather
            than failing, so a bad link cannot blank the dashboard.
          schema:
            type: integer
            default: 14
            example: 14
        - $ref: "#/components/parameters/OptionalRaceId"
      responses:
        "200":
          description: One point per day, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelinePoint"
        "400":
          description: race_id is not a uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/reports/referral-sources:
    get:
      operationId: referralSources
      summary: How runners heard about the race (admin)
      description: >-
        Confirmed registrations grouped by referral source, most common first.
      tags:
        - reports
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OptionalRaceId"
      responses:
        "200":
          description: Counts by source, descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferralCount"
        "400":
          description: race_id is not a uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/reports/shirt-sizes:
    get:
      operationId: shirtSizes
      summary: Shirt sizes to order (admin)
      description: >-
        Confirmed registrations grouped by shirt size, in the size chart's
        order rather than alphabetically. Registrations whose modalidad
        includes no shirt are reported under an empty size instead of being
        dropped, so the counts still add up to the registration total.
      tags:
        - reports
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OptionalRaceId"
      responses:
        "200":
          description: Counts by size, in chart order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShirtSizeCount"
        "400":
          description: race_id is not a uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/participants:
    get:
      operationId: listParticipants
      summary: The participants report (admin)
      description: >-
        Everyone who has registered, searchable, filterable and paginated,
        with how many races each has run. That count is a runner's full
        history: filtering by race narrows WHO is listed, not the number
        beside their name. Like every dashboard widget it counts confirmed
        registrations only — a pending one means the runner never got in — so
        someone whose registration never completed shows zero.
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Matches first names, last names, email or CI
          schema:
            type: string
            example: rojas
        - $ref: "#/components/parameters/OptionalRaceId"
        - name: gender
          in: query
          required: false
          schema:
            type: string
            enum: [M, F, X]
        - name: age_min
          in: query
          required: false
          description: Age in completed years, inclusive
          schema:
            type: integer
            example: 25
        - name: age_max
          in: query
          required: false
          description: Age in completed years, inclusive
          schema:
            type: integer
            example: 35
        - name: page
          in: query
          required: false
          description: 1-based. Values below 1 are clamped rather than rejected.
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          description: Defaults to 25, capped at 100.
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: One page of participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantPage"
        "400":
          description: >-
            An age that is not a whole number, a race_id that is not a uuid, a
            gender outside the chart, or an age range that cannot exist
            (negative, or a minimum above the maximum)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: age range is invalid
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate and receive tokens
      description: Returns a short-lived access token in the body and sets a long-lived refresh token in an httpOnly cookie.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Access token in body, refresh token in a Set-Cookie header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Malformed body or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials (same response whether the email is unknown or the password is wrong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid credentials
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate tokens using the refresh cookie
      description: Reads the refresh token from the httpOnly cookie, issues a new access token and a rotated refresh token. Reusing an already-rotated token revokes the whole session family.
      tags:
        - auth
      responses:
        "200":
          description: Rotated. New access token in body, new refresh token in a Set-Cookie header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Missing, expired, invalid, or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: token reuse detected
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Log out the current session
      description: Revokes the session family of the refresh cookie and clears the cookie. Only this device is logged out; other devices keep their sessions. Idempotent — succeeds even without a valid cookie. The client should also discard its in-memory access token.
      tags:
        - auth
      responses:
        "204":
          description: Logged out (or already logged out)
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database connectivity check
      tags:
        - system
      responses:
        "200":
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "503":
          description: Service is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: unavailable
  /api/v1/users:
    post:
      operationId: createUser
      summary: Register a new admin user
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Malformed body or validation failure (invalid email, password out of 8-72 range, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: password must be at least 8 characters
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email is already registered
    get:
      operationId: listUsers
      summary: List admin users
      description: Without filters, returns all users ordered by creation date (newest first). With the email filter, returns an array with the matching user or an empty array — no match is not an error.
      tags:
        - users
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: false
          description: Filter by exact email (case-insensitive)
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: The email filter is not a valid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email is invalid
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: >-
        Returns the profile of the user identified by the access token. The
        access token only carries the user id, so the frontend calls this
        endpoint to resolve the full profile: to show "logged in as ...", to
        populate the UI on app load, and to confirm the session is still valid
        (a 401 means the token expired and the user must log in again).
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/users/me/password:
    put:
      operationId: changePassword
      summary: Change the authenticated user's password
      description: Verifies the current password before setting the new one, so a leaked access token alone cannot change the credential. On success, all of the user's sessions are revoked (every device, including this one) — the user must log in again with the new password.
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Malformed body or the new password fails the policy (8-72 chars)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated, or the current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: current password is incorrect
  /api/v1/users/{id}:
    get:
      operationId: getUserById
      summary: Get an admin user by ID
      tags:
        - users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The id is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid user id
        "404":
          description: No user with that ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: user not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OptionalRaceId:
      name: race_id
      in: query
      required: false
      description: >-
        Our internal race id, from GET /races. Absent means across all races.
      schema:
        type: string
        format: uuid
  schemas:
    TimelinePoint:
      type: object
      properties:
        date:
          type: string
          format: date
          description: A plain day, not an instant — the chart plots days
          example: "2026-08-15"
        count:
          type: integer
          example: 3
    ReferralCount:
      type: object
      properties:
        source:
          type: string
          example: Instagram
        count:
          type: integer
          example: 12
    ShirtSizeCount:
      type: object
      properties:
        size:
          type: string
          enum: ["", XS, S, M, L, XL, XXL]
          description: Empty is the bucket for registrations with no shirt
          example: M
        count:
          type: integer
          example: 8
    ParticipantRow:
      type: object
      properties:
        participant_id:
          type: string
          format: uuid
        first_names:
          type: string
        last_names:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        document_id:
          type: string
          description: The runner's CI
        gender:
          type: string
          enum: [M, F, X]
        birth_date:
          type: string
          format: date
        age:
          type: integer
          description: Completed years today, derived rather than stored
          example: 26
        races_count:
          type: integer
          description: >-
            Confirmed registrations across every race — a full history that
            the race_id filter does not narrow
          example: 3
    ParticipantPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantRow"
        total:
          type: integer
          description: Rows matching the filter, across all pages
          example: 130
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 25
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@finishline.dev
        password:
          type: string
          format: password
          example: admin.123
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          example: admin.123
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: a-stronger-password
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_at
      properties:
        access_token:
          type: string
          description: "Short-lived JWT to send as `Authorization: Bearer <token>`."
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
          example: "2026-06-13T22:16:56Z"
    Race:
      type: object
      properties:
        race_id:
          type: string
          format: uuid
          description: Our internal id — use it to register and to pull the report
        document_id:
          type: string
          description: The Sanity slug — use it to fetch display content from Sanity
          example: renacer
        name:
          type: string
          example: Carrera 10K
        date:
          type: string
          format: date
          example: "2026-08-15"
        capacity:
          type: integer
          example: 500
    RegisterRequest:
      type: object
      required:
        - race_document_id
        - first_names
        - last_names
        - email
        - phone
        - document_id
        - birth_date
        - gender
        - referral_source
      properties:
        race_document_id:
          type: string
          description: The race's Sanity slug (Sanity owns the registration content, not the registration flow)
          example: renacer
        first_names:
          type: string
          example: Amir
        last_names:
          type: string
          example: Rojas
        email:
          type: string
          format: email
          example: amir@example.com
        phone:
          type: string
          example: "+59171234567"
        document_id:
          type: string
          description: The runner's CI (cédula de identidad). Stored only — not validated against RENIEC/SEGIP, not enforced unique.
          example: "1234567"
        birth_date:
          type: string
          format: date
          description: ISO date, YYYY-MM-DD
          example: "2000-06-09"
        gender:
          type: string
          enum: [M, F, X]
        referral_source:
          type: string
          example: Instagram
        modalidad:
          type: string
          description: The distance/variant chosen on the detail page (e.g. "10K · Con polera"). Optional — display data, not validated.
          example: "10K · Con polera"
        shirt_size:
          type: string
          enum: ["", XS, S, M, L, XL, XXL]
          description: >-
            Shirt size for THIS race — it lives on the registration, so the
            same runner can pick a different size next time. Optional (a
            modalidad without a shirt has none); any other value is a 400.
            Case-insensitive and trimmed on the way in.
          example: M
    RegistrationResponse:
      type: object
      properties:
        registration_id:
          type: string
          format: uuid
        race_document_id:
          type: string
          description: The race's Sanity slug (echoes the request)
        first_names:
          type: string
        last_names:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        document_id:
          type: string
          description: The runner's CI (cédula de identidad)
        gender:
          type: string
          enum: [M, F, X]
        modalidad:
          type: string
          description: The distance/variant chosen on the detail page; empty when not provided
        shirt_size:
          type: string
          enum: ["", XS, S, M, L, XL, XXL]
          description: Shirt size for this race; empty when the modalidad has no shirt
        status:
          type: string
          enum: [pendiente, confirmado]
        dorsal:
          type: integer
          nullable: true
          description: Assigned on confirmation; null while pending
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
    RegistrationReportRow:
      type: object
      properties:
        registration_id:
          type: string
          format: uuid
        first_names:
          type: string
        last_names:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        gender:
          type: string
          enum: [M, F, X]
        modalidad:
          type: string
          description: The distance/variant chosen; empty when not provided
        shirt_size:
          type: string
          enum: ["", XS, S, M, L, XL, XXL]
          description: Shirt size for this race; empty when the modalidad has no shirt
        status:
          type: string
          enum: [pendiente, confirmado]
        dorsal:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
    SanityWebhook:
      type: object
      description: >-
        Shaped by the GROQ projection configured in the Studio webhook UI;
        NOT yet verified against the real webhook config (see design doc,
        open question) — flat race fields plus `operation` from Sanity's
        `delta::operation()` GROQ helper.
      required:
        - operation
      properties:
        operation:
          type: string
          enum: [create, update, delete]
          example: create
        slug:
          type: string
          description: The race's Sanity slug (external id)
          example: renacer
        title:
          type: string
          example: Carrera 10K
        date:
          type: string
          format: date
          example: "2026-08-15"
        capacity:
          type: integer
          example: 500
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
          example: ok
    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: secure-password
    User:
      type: object
      required:
        - id
        - name
        - email
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 27494c6b-6532-4517-a7ea-b9f63279f7a2
        name:
          type: string
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana@example.com
        created_at:
          type: string
          format: date-time
          example: "2026-06-12T20:23:18.787316Z"
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: email is already registered
